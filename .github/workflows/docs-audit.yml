name: Docs audit

# La auditoria de documentacion (tests/documentedOptions.test.js, 13 reglas) es una
# puerta, no un recordatorio: si una regla falla, este job falla y el PR no se mergea.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Sin filtro de `paths` a proposito: un check requerido que no llega a ejecutarse deja el
# PR bloqueado para siempre. Aqui se corre siempre.
concurrency:
  group: docs-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
# ── LOS PINES: DONDE VIVE EL DATO, Y QUE SE LEA ──
  #
  # Job aparte y no un paso del de auditoria, por una razon que es de estructura y
  # no de gusto: la matriz de checkouts necesita el mapa de pines como OUTPUT DE
  # JOB, porque `strategy` no puede leer `steps` de otro paso de otro job. Y un
  # output de job tiene que salir de un job.
  #
  # Lo que hace, entonces, es lo minimo: leer `siblings.json` y publicar el mapa.
  # Publicar en un job que no necesita la red es lo que permite que la matriz se
  # construya sola y que anadir un quinto hermano sea tocar `siblings.json` y nada
  # mas, sin un `ref:` mas en ningun fichero.
  #
  # Aqui tambien corre el verificador, que ejecuta las expresiones `fromJSON` del
  # workflow de verdad y falla si algun checkout se queda con la rama por defecto.
  # Va aqui y no en la suite porque es lo que hace que este workflow sea de fiar
  # ANTES de gastar 20 minutos de runner: si un `ref:` no resuelve a un SHA, que lo
  # diga en el primer minuto.
  pines:
    name: Los pines de los hermanos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      hermanos: ${{ steps.pines.outputs.hermanos }}
      ficheros: ${{ steps.pines.outputs.ficheros }}

    steps:
      # Este checkout va a `ABDSharedAssets/` por el mismo motivo que en el job de
      # auditoria: los generadores buscan a sus hermanos en la CARPETA HERMANA de
      # este paquete, no dentro de el.
      - name: Checkout ABDSharedAssets
        uses: actions/checkout@v7
        with:
          path: ABDSharedAssets
          fetch-depth: 1

      # El unico sitio del repositorio donde vive un SHA de hermano. El script
      # falla si el inventario no esta, no se parsea, o si un hermano llega sin un
      # SHA utilizable, y eso es aqui y no en un `ref:` a medias.
      - name: Publicar los pines (la fuente es siblings.json)
        id: pines
        working-directory: ABDSharedAssets
        run: node scripts/pines-hermanos.mjs

      - name: Comprobar que cada checkout resuelve a un SHA, no a una rama
        working-directory: ABDSharedAssets
        run: node scripts/verificar-pines-workflow.mjs

  # ── UN CHECKOUT POR HERMANO, Y QUE LOS DECIDA EL INVENTARIO ──
  #
  # La matriz sale de `fromJSON(needs.pines.outputs.hermanos)`, que es una LISTA de
  # `{repo, sha}`. Y es una lista y no un mapa por una razon que no es de gusto y
  # que sale de como GitHub expande una matriz: un array da UNA PATA POR ELEMENTO,
  # y un objeto da una pata sola con todos los repos dentro. Con el mapa, el job
  # bajaria el primer repo una vez, `matrix.hermano.repo` no existiria, y el rojo
  # —si lo hubiera— no diria de quien. Con la lista, cada pata es un hermano:
  #
  #     repo: ${{ matrix.hermano.repo }}
  #     ref:  ${{ matrix.hermano.sha }}
  #
  # Un hermano mas en `siblings.json` es una pata mas, sin tocar este fichero. Es
  # lo que comprueba `scripts/verificar-pines-workflow.mjs`: que la expansion de la
  # matriz sea exactamente una pata por hermano del inventario.
  #
  # POR QUE NO ES UNO SOLO JOB CON CUATRO PASOS, QUE ES LO DE ANTES. Y es
  # importante que se entienda, porque no es una preferencia. Los generadores
  # leen a sus hermanos de la CARPETA HERMANA de este checkout, o sea que los cinco
  # repos tienen que existir en el MISMO workspace. Y en GitHub un job es un
  # workspace: una matriz de cuatro patas son cuatro runners con cuatro sistemas de
  # ficheros, y el generador que busca `../ABDEep` en la pata de ABDEep no lo
  # encuentra. Por eso los checkouts NO pueden ser una matriz dentro del job que
  # corre los generadores, y por eso este job existe y el otro los vuelve a bajar.
  #
  # Que cada pata se llame al repo que baja es lo que se gana: si el pin de ABDEep
  # esta mal, el rojo lo dice `Hermano ABDEep` y no una linea de un log con cuatro
  # repos dentro. Y `fail-fast: false` porque lo que se quiere saber es CUALES
  # estan mal, no solo el primero: un inventario con dos pines viejos es un hecho
  # distinto de uno con un.
  #
  # La pata comprueba, ADEMAS de bajar el commit, que ese commit trae los ficheros
  # que el inventario dice que se le van a abrir. Sin esa comprobacion, un SHA
  # equivocado no da ningun error aqui: baja, el paso se pone verde, y el problema
  # sale mas tarde como un contrato desfasado, que es la peor forma de que salga.
  #
  # La lista sale del output `ficheros`, no de una lista escrita aqui: esa lista es
  # un dato del inventario, y escribirla aqui seria la segunda copia del mismo
  # dato, que es justo lo que este workflow lleva dos commits intentando quitar.
  #
  # La organizacion `ajabadia/` si esta escrita aqui, y es el unico sitio que se
  # queda: es el nombre de la cuenta, no parte del inventario de hermanos, y no
  # cambia cuando anades un repo.
  hermanos:
    name: Hermano ${{ matrix.hermano.repo }}
    needs: pines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    fail-fast: false

    strategy:
      max-parallel: 4
      matrix:
        hermano: ${{ fromJSON(needs.pines.outputs.hermanos) }}

    steps:
      - name: Checkout ${{ matrix.hermano.repo }} (Immutable Sibling Ref)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/${{ matrix.hermano.repo }}
          ref: ${{ matrix.hermano.sha }}
          path: ${{ matrix.hermano.repo }}
          fetch-depth: 1

      # Lo que el generador va a ABRIR de este hermano, ahi dentro. El mensaje de
      # error lleva repo y SHA, porque "falta un fichero" sin decir de quien es no
      # sirve para nada cuando hay cuatro repos en juego.
      - name: Los ficheros que se le van a abrir estan en ese commit
        working-directory: ${{ matrix.hermano.repo }}
        env:
          REPO: ${{ matrix.hermano.repo }}
          SHA_PULSADO: ${{ matrix.hermano.sha }}
          NECESITA: ${{ toJSON(fromJSON(needs.pines.outputs.ficheros)[matrix.hermano.repo]) }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const rel = JSON.parse(process.env.NECESITA);
            const faltan = rel.filter((r) => !fs.existsSync(r));
            const donde = process.env.REPO + " @ " + process.env.SHA_PULSADO;
            if (faltan.length > 0) {
              console.error("::error::" + donde + " no trae: " + faltan.join(", "));
              console.error("El inventario dice que se le van a abrir, asi que el generador");
              console.error("va a leer algo que no esta. Sube el SHA de " + process.env.REPO + " en");
              console.error("siblings.json a un commit que ya lo tenga, y regenera los contratos.");
              process.exit(1);
            }
            console.log("::notice::" + donde + ": los " + rel.length + " ficheros que se le van a abrir estan");
          '

  audit:
    needs: [pines, hermanos]

    name: Preflight + docs audit + suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true

    # Este checkout vive en una SUBCARPETA a proposito, y no por estetica: los
    # generadores de contratos no leen este repo, leen a los HERMANOS. Cada uno
    # busca su fuente en `raiz del monorepo / <repo>`, o sea en la carpeta
    # hermana de este checkout, que es donde tiene que estar. Con el checkout
    # en la raiz del workspace no hay donde poner un hermano sin que acabe
    # dentro del repo, y dentro del repo el generador no lo encuentra.
    #
    # Este checkout va a `ABDSharedAssets/`, y los cuatro hermanos a
    # `ABDSharedCode/`, `ABDEep/`, etc., todos al mismo nivel. Es el layout del
    # monorepo, que es lo que los scripts ya dan por supuesto.
    #
    # Y AQUI NO HAY CHECKOUT DE HERMANOS, que es el cambio de este workflow: los
    # baja el paso de `fetch-missing-siblings.mjs` de mas abajo, al SHA que dice
    # `siblings.json`. Cada uno se baja en su propia pata del job `hermanos`, que
    # es donde se comprueba que el pin es real y que trae lo que el inventario
    # dice. Un job es un workspace, y los generadores necesitan los cuatro
    # hermanos en el suyo, asi que la comprobacion no puede ser la que los deja
    # a mano. La red de seguridad y la puerta se quedan sin el mismo paso, que es
    # justo lo que hacia falta: una queDijera quien lo bajo.
    defaults:
      run:
        working-directory: ABDSharedAssets

    steps:
      - name: Checkout ABDSharedAssets
        uses: actions/checkout@v7
        with:
          path: ABDSharedAssets
          fetch-depth: 1

      # LAS DOS VERSIONES VAN FIJADAS A UNA EXACTA, y no por purismo: las dos son
      # la diferencia entre "el install es reproducible" y "el install es el que
      # le toque". Un `version: '10'` es un COMPROMISO con la 10.x mas reciente
      # que exista el dia que corra el job, y un `node-version: '22'` con la
      # 22.x mas reciente. Los dos se mueven solos.
      #
      # Esto ya habia pasado y hacia ruido de verdad, no teorico. La linea de
      # abajo ponia `version: '10'` mientras el comentario de al lado decia
      # "la raiz del workspace declara pnpm@10.25.0": los dos enunciados no se
      # podia leer los dos como verdad a la vez, y no habia forma de saber
      # cual mandaba. Ahora el numero esta escrito una vez y el comentario lo
      # explica.
      #
      # pnpm 10.25.0 es la version que declara `packageManager` en el
      # `package.json` de la raiz de la suite, que es la que fija el lockfile de
      # este paquete. Si esa raiz mueve la suya, este numero se queda viejo a
      # proposito: cambiarlo aqui es una decision, no un efecto secundario.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.25.0'

      # Node 22.23.3, y la 22 no es por moda: el smoke ARIA habla CDP a pelo con
      # el `WebSocket` GLOBAL de Node, que llego en la 22 (en la 21 iba detras de
      # un flag, y en la 20 no existe). Con la 20, esa linea era un
      # `ReferenceError: WebSocket is not defined` y este job llevaba cinco
      # corridas en rojo por un motivo que no era de ningun contrato. La minima
      # para que el smoke hable sea la 22; la exacta, para que el job que hoy
      # esta en verde siga siendo el mismo job dentro de seis meses.
      #
      # Ojo al orden de los dos pasos de arriba, que no es cosmetico:
      # `pnpm/action-setup` se apoya en el Node que este paso deja en el PATH, y
      # al reves (pnpm antes de Node) el Node instalado se lleva por delante la
      # shim de pnpm y `pnpm install` deja de ser la version fijada.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'

      # LA RED DE ESTE JOB, Y AHORA LA PUERTA TAMBIEN. Es el mismo patron que usa
      # ABDAudioLab en su `CMakeLists.txt` —usar el hermano si esta a mano, y si
      # no bajarlo con el SHA fijado—, aqui en un script porque este paquete no es
      # de CMake: son generadores de Python que leen cabeceras sueltas.
      #
      # Antes esto era un `if: always()` DEBAJO de cuatro `actions/checkout`: la
      # red por si uno fallaba. Ahora es lo que baja a los cuatro, porque los
      # checkouts viven en el job `hermanos` y ese workspace no es este. El
      # `if: always()` se fue con ellos: aqui ya no hay un checkout que se pueda
      # saltar, y si este job corriendo es que los pines se han resuelto y el
      # job `hermanos` ha bajado bien cada commit. Un rojo aqui ya no puede ser
      # "no he podido comprobar" por un checkout que fallo: eso lo dice el job
      # `hermanos`, en la pata del repo que fallo, y este job ni se ejecuta.
      #
      # Es idempotente y solo clona lo que falta: un hermano ya presente no se
      # toca, y por eso no puede pisar el trabajo de nadie. Es el mismo paso que
      # corre en local, lo que significa que el preflight que se ve aqui es el
      # mismo que se ve en la mesa.

      - name: Fetch missing siblings (pinned SHA)
        run: node scripts/fetch-missing-siblings.mjs

      # Los tres generadores de contratos son python y el runner de Ubuntu no lo
      # trae. Sin este paso el preflight no se puede ni ejecutar, y un preflight
      # que no corre y sale en verde es peor que no tenerlo: parece que hay puerta.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A diferencia del resto de la suite, aqui SI hay lockfile versionado y es suelto
      # (un unico importer, el de este paquete): el install es reproducible y no hace
      # falta el layout de hermanos que reproduce pnpm-workspace-bootstrap.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # EL PREFLIGHT, antes que nada. Los contratos de contracts/ son GENERADOS: hay
      # codigo en ABDSharedCode y en los repos de los synths que los produce, y el
      # json es una copia. Si alguien toca la fuente y no regenera, el CI sigue en
      # verde y el PR entra con dos verdades distintas sobre las curvas: los paneles
      # dibujan con el json y el motor lee la cabecera.
      #
      # Por eso esto va antes de la suite y no dentro de ella. Es un paso propio
      # porque un fallo de contrato tiene que LEERSE como un contrato desfasado, y
      # porque metido en un test se puede saltar con un filtro de ruta.
      #
      # Sin `paths:` a proposito, igual que el job entero: un check requerido que no
      # llega a ejecutarse deja el PR bloqueado para siempre. Si se tocara el
      # generador sin tocar el json, que es justo el caso que vigila, el workflow
      # tiene que CORRER IGUAL.
      - name: "Preflight: generated contracts are up to date"
        run: pnpm run preflight
      # EL S950, CON SU NOMBRE PROPIO. Y SI, ESTA YA DENTRO DEL PREFLIGHT: los tres
      # generadores de `scripts/` estan declarados en `CONTRATOS` y el preflight los
      # corre a los tres, este incluido. No es una puerta nueva, es la MISMA puerta
      # con etiqueta.
      #
      # Lo que se compra aqui es que el fallo se lea. Con el preflight solo, un
      # contrato S950 viejo se ve como un paso rojo que se llama "Preflight: generated
      # contracts are up to date", y para saber que era el S950 hay que abrir el log y
      # buscarlo en las tres ultimas lineas. Con este paso, el que se pone rojo se
      # llama `S950: el contrato coincide con la tabla de C++`, el check tiene nombre
      # propio en la pestana, y se puede pedir como required sin arrastrar al resto.
      #
      # Por eso NO se sustituye al preflight: este lo sustituye. Si alguien limpia "el
      # paso que sobra", el otro se queda y no pasa nada, que es el riesgo de dejar dos
      # puertas para lo mismo sin el comment que las ata. Aqui esta el comment.
      #
      # Sale por los NOMBRES de `package.json` y no por la ruta del script a proposito:
      # el mensaje de fallo del generador dice `pnpm generate:s950-contract`, y que el
      # comando que se ejecuta sea el mismo que se cita es lo que hace que ese mensaje
      # sirva para algo en vez de ser una pista que hay que traducir.
      #
      # Los dos van en el mismo paso porque son la mitad del mismo contrato: el
      # catalogo de 38 campos y las 6 curvas de calibracion salen de la misma cabecera
      # de ABDSharedCode, y un S950 a medio regenerar es un S950 desfasado.
      - name: "S950: el contrato coincide con la tabla de C++"
        run: |
          pnpm run check:s950-contract
          pnpm run check:s950-cal

      # LOS GENERADORES DE LOS HERMANOS, CON SU NOMBRE PROPIO.
      #
      # Esta puerta vigila `GENERADORES_HERMANOS` en el preflight: los generadores
      # de ABDEep, ABDMS2000 y ABDNeural, que viven alli con sus fuentes y sus
      # salidas. Cada uno se corre con su `--check` —que NO escribe, y por eso se
      # puede correr desde un pipeline sin ensuciar el checkout del hermano— y
      # ademas se mira que sus salidas existan y lleven marca de generado.
      #
      # Va como paso aparte, y no solo porque el nombre se lea mejor. Es que su
      # verde NO significa lo mismo que el del preflight: el generador de ABDNeural
      # es un ejecutable de C++ que este repo no compila, asi que de el solo se
      # comprueban las salidas, no que esten al dia —eso lo dice el build de
      # ABDNeural—. Con un paso con nombre propio, quien lee la pestana ve que los
      # .gen de ABDNeural NO estan cubiertos aqui, en vez de tener que deducirlo
      # del log.
      #
      # Y el arreglo que cita el mensaje NO es un `pnpm generate:*` de este
      # paquete: es `cd ../<repo> && node <generador>`. Por eso el mensaje dice
      # eso y no el nombre de un script de aqui, que no existe.
      - name: "Hermanos: sus generadores producen lo que declaran"
        run: node scripts/check-hermanos-generadores.mjs

      # LOS TRES GUARDAS DE ESCRITURA, GENERADOS DESDE AQUI
      #
      # Los `guardasDeEscritura.test.js` de ABDEep, ABDMS2000 y ABDNeural son copias
      # MATERIALIZADAS: cada repo tiene el suyo y no importa de nadie, porque un
      # guard que dependiera del hermano dejaria de vigilar justo cuando ese hermano
      # no esta clonado. El precio de esa copia es que se pueden separar, y de ahi
      # este paso: compara cada uno contra lo que sale de
      # `scripts/generar-guardas-escritura.mjs`, que es el motor comun de los tres.
      #
      # Sin esto, el fallo es silencioso y con una forma concreta: el guard de un repo
      # aprende a ver algo que los otros dos no ven, y nadie se entera hasta que el
      # otro repo escribe sin que nadie mire. Que ya paso con PowerShell.
      #
      # Sale en rojo si alguno se edito a mano o si el motor cambio y ese repo no se
      # regenero. El arreglo que dice es `pnpm generar:guardas`, y el mensaje nombra
      # el repo: el problema es de uno, no de los tres.
      - name: "Hermanos: sus guardas de escritura no se han separado del motor"
        run: node scripts/generar-guardas-escritura.mjs --check


      # El paso que bloquea el merge, suelto y antes de la suite: asi un fallo de
      # documentacion se lee como tal y no como "un test rojo" entre seiscientos.
      - name: Audit documentation (13 rules)
        run: pnpm exec vitest run tests/documentedOptions.test.js

      - name: Run full Vitest suite
        run: pnpm test

      # EL NAVEGADOR NO SE DA POR HECHO. Antes este paso resolvia Chromium en
      # /usr/bin/google-chrome, que el runner de Ubuntu traia: una suposicion
      # sobre la imagen del runner, no sobre este repositorio, y justo la clase de
      # cosa que se rompe sola cuando GitHub actualiza la imagen.
      #
      # Ahora el navegador se INSTALA aqui y se le pasa DENTRADO. Playwright se usa
      # como descarga (`pnpm dlx`, sin tocar package.json ni el lock: el smoke no
      # declara dependencias de navegador y no hay que añadirle una), y el
      # binario se localiza con `--resolve-chrome`, que es el MISMO resolutor que
      # usa el smoke en local. Si divergieran, el paso pasaria y el smoke luego no
      # encontraria nada: por eso no se vuelve a escribir la ruta a mano.
      # La version va FIJADA (no `@1`, que se mueve solo): el binario que baja
      # Playwright es el que decide contra que librerias del sistema esta
      # compilado, asi que un flotante puede cambiar el navegador de un dia para
      # otro sin que este workflow haya cambiado. Cuando se actualice hay que
      # tocar esta linea a proposito.
      - name: Install Chromium for the ARIA smoke (Playwright cache)
        run: pnpm dlx playwright@1.63.0 install --with-deps chromium

      - name: Export the Chromium path (and say which one it is)
        id: chrome
        run: |
          set -euo pipefail
          path="$(node smoke/a11y-smoke.mjs --resolve-chrome)"
          echo "CHROME_PATH=$path" >> "$GITHUB_OUTPUT"
          echo "::group::Navegador del smoke ARIA"
          echo "  $path"
          echo "::endgroup::"

      - name: Smoke ARIA on real Chromium
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.CHROME_PATH }}
        run: pnpm run smoke:a11y
